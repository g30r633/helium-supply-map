<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vellum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
    :root {
      --bg:#09090b; --surface:#111113; --border:#1e1e22;
      --text:#f0eff1; --muted:#8a8a8e; --dim:#4a4a50;
      --accent:#d4a574;
    }
    body {
      width: 360px; max-height: 600px;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-y: auto; overflow-x: hidden;
    }
    body::-webkit-scrollbar { width: 3px; }
    body::-webkit-scrollbar-track { background: var(--bg); }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .head {
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 5;
    }
    .brand { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; }
    .status {
      font-family: 'DM Mono', monospace;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .status.pro { color: var(--accent); }

    .site {
      padding: 8px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--muted); letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .site-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    /* The hostname now shares its row with the speed control. Without this it wraps to a
       second line and silently makes the row 13px taller, pushing the grid down. */
    #site-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .site-dot.active { background: #6ec97a; box-shadow: 0 0 6px #6ec97a; }

    .label {
      padding: 14px 18px 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .label-text { font-size: 12px; font-weight: 600; letter-spacing: -0.2px; }
    .label-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--dim); letter-spacing: 0.5px;
    }

    .themes {
      margin: 0 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      border-radius: 10px;
      overflow: hidden;
    }
    .theme {
      position: relative; aspect-ratio: 1;
      overflow: hidden; cursor: pointer;
      transition: all 0.18s ease;
    }
    .theme:hover { opacity: 0.85; }
    .theme.active { box-shadow: inset 0 0 0 2px var(--text); }
    .theme.locked .theme-preview { filter: grayscale(0.32) brightness(0.66); }
    .theme.locked::after {
      content: ''; position: absolute; inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      background: rgba(0,0,0,0.12); pointer-events: none;
    }
    .theme-preview { width: 100%; height: 100%; }
    .theme-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 3px 5px;
      font-family: 'DM Mono', monospace;
      font-size: 7px; letter-spacing: 0.3px; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      background: linear-gradient(transparent, rgba(0,0,0,0.3));
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .theme-num { opacity: 0.5; }
    .theme-pro {
      position: absolute; top: 3px; right: 3px;
      font-family: 'DM Mono', monospace;
      font-size: 6px; letter-spacing: 0.4px;
      color: var(--accent); text-transform: uppercase; font-weight: 600;
      background: rgba(0,0,0,0.5); padding: 1.5px 4px; border-radius: 2px;
    }
    .theme-fav {
      position: absolute; top: 2px; left: 2px; z-index: 2;
      width: 15px; height: 15px; padding: 0; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); border: none; border-radius: 3px;
      color: rgba(255,255,255,0.55); font-size: 9px; cursor: pointer;
      opacity: 0; transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .theme:hover .theme-fav { opacity: 1; }
    .theme-fav:hover { background: rgba(0,0,0,0.72); color: var(--accent); }
    .theme-fav.on { opacity: 1; color: var(--accent); }
    .theme.previewing { box-shadow: inset 0 0 0 2px var(--accent); }
    .theme.previewing .theme-preview { filter: none; }
    .theme.previewing .theme-pro { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── Sidebar sections ── */
    .browser { display: flex; align-items: stretch; }
    .sections {
      width: 92px; flex-shrink: 0; padding: 8px 0 8px 10px;
      display: flex; flex-direction: column; gap: 1px;
      border-right: 1px solid var(--border);
    }
    .section-btn {
      text-align: left; background: transparent; border: none; cursor: pointer;
      color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
      padding: 7px 9px; border-radius: 7px; transition: all 0.14s;
      display: flex; align-items: center; justify-content: space-between; gap: 4px;
    }
    .section-btn:hover { background: var(--surface); color: var(--text); }
    .section-btn.active { background: var(--surface); color: var(--text); }
    .section-btn .sec-count {
      font-family: 'DM Mono', monospace; font-size: 9px; color: var(--dim);
    }
    .section-btn.active .sec-count { color: var(--accent); }
    /* "Free" filter — green reads as "available to you", distinct from Pro gold */
    /* Favourites reads gold, matching the star on the cards */
    .section-btn.is-fav { color: var(--accent); }
    .section-btn.is-fav .sec-count { color: var(--accent); opacity: 0.7; }
    .section-btn.is-fav.active { background: rgba(212,165,116,0.10); }
    .section-btn.is-free { color: #6ec97a; }
    .section-btn.is-free .sec-count { color: #6ec97a; opacity: 0.7; }
    .section-btn.is-free.active { background: rgba(110,201,122,0.10); color: #8fdc98; }
    .section-btn.is-free.active .sec-count { color: #8fdc98; }
    .section-btn .sec-new {
      font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.5px;
      color: #1a1410; background: var(--accent); padding: 1px 4px; border-radius: 3px;
    }
    .grid-wrap { flex: 1; min-width: 0; padding: 10px 12px 8px; max-height: 434px; overflow-y: auto; }
    .grid-wrap::-webkit-scrollbar { width: 3px; }
    .grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .grid-head {
      display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;
    }
    .grid-title { font-size: 12px; font-weight: 600; }
    .search-wrap { position: relative; margin: 0 0 8px; }
    .search-input {
      width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 11px;
      padding: 6px 24px 6px 25px; outline: none; transition: border-color 0.14s;
    }
    .search-input::placeholder { color: var(--dim); }
    .search-input:focus { border-color: rgba(212,165,116,0.5); }
    .search-icon {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: var(--dim); pointer-events: none;
    }
    .search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 2px 4px;
      color: var(--dim); font-size: 12px; line-height: 1; display: none;
    }
    .search-clear:hover { color: var(--text); }
    .search-wrap.has-query .search-clear { display: block; }
    .grid-empty {
      grid-column: 1 / -1; padding: 26px 8px; text-align: center;
      color: var(--dim); font-size: 11px; line-height: 1.6;
    }
    .grid-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--dim); }
    .browser .themes { margin: 0; grid-template-columns: repeat(3, 1fr); }

    .preview-banner {
      display: none; padding: 8px 18px;
      background: rgba(212,165,116,0.08);
      border-bottom: 1px solid rgba(212,165,116,0.2);
      align-items: center; gap: 10px;
    }
    .preview-banner.show { display: flex; }
    .preview-text {
      flex: 1; font-size: 12px; color: var(--text);
      font-family: 'DM Mono', monospace; letter-spacing: 0.3px;
    }
    .preview-text strong { font-weight: 500; color: var(--accent); }
    .preview-progress { width: 36px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .preview-progress-fill { height: 100%; width: 100%; background: var(--accent); }
    .preview-banner.show .preview-progress-fill { animation: countdown 3s linear forwards; }
    @keyframes countdown { from { width:100%; } to { width:0%; } }

    /* Theme speed — parked on the site row rather than in a row of its own.
       The footer sat below the fold in a 600px popup, and a new strip above the grid
       is the thing that made the old Motion tab feel intrusive. This row already
       exists and has empty space to the right of the hostname, so it costs no height. */
    .speed-mini {
      display: flex; align-items: center; gap: 7px;
      margin-left: auto; min-width: 0; flex: 0 0 150px;
    }
    .speed-mini label {
      font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--dim); flex-shrink: 0; cursor: pointer;
    }
    /* A range input carries a chunky default height that pushed the site row from 30px
       to 43px. appearance:none plus an explicit thumb keeps the control inside the row. */
    .speed-mini input[type=range] {
      -webkit-appearance: none; appearance: none;
      flex: 1; min-width: 70px; height: 12px; margin: 0; padding: 0;
      background: transparent; cursor: pointer;
    }
    .speed-mini input[type=range]::-webkit-slider-runnable-track {
      height: 3px; border-radius: 2px; background: var(--border);
    }
    .speed-mini input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 10px; border-radius: 50%; border: none;
      background: var(--accent); margin-top: -3.5px;
    }
    .speed-mini input[type=range]:hover::-webkit-slider-thumb { background: var(--text); }
    .speed-mini output {
      font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted);
      width: 30px; text-align: right; flex-shrink: 0;
    }
    .footer {
      padding: 14px 18px 16px;
      border-top: 1px solid var(--border);
      margin-top: 14px;
      position: sticky; bottom: 0; background: var(--bg);
    }
    .upgrade {
      width: 100%; padding: 11px;
      border-radius: 10px;
      background: var(--text); color: var(--bg);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500;
      transition: all 0.15s; border: none;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .upgrade:hover { opacity: 0.88; transform: translateY(-1px); }
    .upgrade-price {
      font-family: 'DM Mono', monospace;
      font-size: 10px; opacity: 0.5;
      margin-left: auto;
    }
    .upgrade.flash { animation: glow 1.5s ease; }
    @keyframes glow {
      0% { box-shadow: 0 0 0 0 rgba(212,165,116,0); }
      30% { box-shadow: 0 0 0 4px rgba(212,165,116,0.25); }
      100% { box-shadow: 0 0 0 0 rgba(212,165,116,0); }
    }
    .footer-links {
      display: flex; justify-content: space-between;
      margin-top: 10px;
      font-size: 11px; color: var(--dim);
    }
    .footer-links a { color: var(--muted); text-decoration: none; cursor: pointer; }
    .footer-links a:hover { color: var(--text); }
    body.pro .upgrade { display: none; }
    .status.trial { color: #6ec97a; }
    .status.trial .dot { background: #6ec97a; }

    .company-btn {
      width: 100%; padding: 10px 12px;
      border-radius: 9px; cursor: pointer;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500;
      transition: all 0.15s; text-align: left;
    }
    .company-btn:hover { border-color: var(--accent); }
    .company-btn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

    /* Billing / dunning warning — amber so it reads as "act soon", not "broken" */
    .billing-banner {
      display: none; align-items: center; gap: 8px;
      margin: 12px 18px 0; padding: 10px 12px;
      background: rgba(232,164,76,0.10);
      border: 1px solid rgba(232,164,76,0.32);
      border-radius: 10px;
    }
    .billing-banner.show { display: flex; }
    .billing-text { flex: 1; font-size: 11.5px; color: var(--text); line-height: 1.45; }
    .billing-text strong { color: #e8a44c; font-weight: 600; }
    .billing-go {
      flex-shrink: 0; padding: 6px 12px; border-radius: 7px; border: none; cursor: pointer;
      background: #e8a44c; color: #1a1410; font-size: 12px; font-weight: 600;
      font-family: 'Inter', sans-serif; transition: opacity 0.15s;
    }
    .billing-go:hover { opacity: 0.88; }

    .review-banner {
      display: none; align-items: center; gap: 8px;
      margin: 12px 18px 0; padding: 10px 12px;
      background: rgba(212,165,116,0.08);
      border: 1px solid rgba(212,165,116,0.25);
      border-radius: 10px;
    }
    .review-banner.show { display: flex; }
    .review-text { flex: 1; font-size: 12px; color: var(--text); line-height: 1.4; }
    .review-go {
      flex-shrink: 0; padding: 6px 12px; border-radius: 7px; border: none; cursor: pointer;
      background: var(--accent); color: #1a1410; font-size: 12px; font-weight: 600;
      font-family: 'Inter', sans-serif; transition: opacity 0.15s;
    }
    .review-go:hover { opacity: 0.88; }
    .review-x {
      flex-shrink: 0; width: 20px; height: 20px; border: none; cursor: pointer;
      background: transparent; color: var(--dim); font-size: 16px; line-height: 1;
    }
    .review-x:hover { color: var(--text); }
  </style>

  </div>

    <span class="preview-text">Previewing <strong id="preview-name">Theme</strong></span>
    <div class="preview-progress"><div class="preview-progress-fill"></div></div>
  </div>

  <div id="company-section" style="display:none">
    <div class="label">
      <span class="label-text">Your company</span>
      <span class="label-count">team background</span>

    <div id="company-bg-row" style="margin:0 18px 4px; display:grid; gap:6px"></div>
  </div>

  <div class="browser">
    <div class="sections" id="sections"></div>
    <div class="grid-wrap">
      <div class="search-wrap" id="search-wrap">
        <span class="search-icon">&#9906;</span>
        <input class="search-input" id="search" type="text" spellcheck="false"
               autocomplete="off" placeholder="Search 250 themes…" aria-label="Search themes">
        <button class="search-clear" id="search-clear" title="Clear" aria-label="Clear search">&times;</button>
      </div>
      <div class="grid-head">
        <span class="grid-title" id="grid-title">All</span>
        <span class="grid-count" id="grid-count"></span>
      </div>
      <div class="themes" id="theme-grid"></div>

  </div>

  <div class="footer">
    <button class="upgrade" id="upgrade">
      Unlock all 189 Pro themes
      <span class="upgrade-price">$2.99/mo</span>
    </button>
    <div class="footer-links">
      <a id="link-account">Account</a>
      <a id="link-screenshot">Screenshot</a>
      <a id="link-help">Help</a>

  <script src="popup.js"></script>
