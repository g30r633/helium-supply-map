<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#1a1816"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f5f1eb"/>
      <stop offset="100%" stop-color="#d4c5a9"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle background -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="126" height="126" rx="27" ry="27" fill="none" stroke="rgba(245,241,235,0.06)" stroke-width="1"/>

  <!-- The V mark - made of two refined strokes meeting like a paper fold -->
  <g transform="translate(64 64)">
    <!-- Left stroke -->
    <path d="M -22 -20 L 0 22 L 22 -20"
          fill="none"
          stroke="url(#fold)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Subtle inner shadow line for depth -->
    <path d="M 0 22 L 22 -20"
          fill="none"
          stroke="#0a0908"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0.3"/>
  </g>
</svg>
